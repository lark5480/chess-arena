# Chess Arena — Nginx 反向代理配置（含 SSE 长连接必需项）
# 放置：/etc/nginx/conf.d/chess.conf（把 你的域名 替换掉）
# 校验：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name 你的域名;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 实时通道（SSE 长连接）——三个必设项，缺一个实时性就废
    location /api/rooms/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";     # 1) 保持长连接（HTTP/1.1）
        proxy_buffering off;                # 2) 不缓冲，事件即时下发
        proxy_cache off;
        proxy_read_timeout 86400s;          # 3) 长超时（默认 60s 会掐断长连接）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
